name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the linter: it reads the source, so the plugin's own dependencies are not needed.
      - name: Install ruff
        run: pip install "$(grep '^ruff' requirements-dev.txt)"

      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target; Linux catches path/platform assumptions.
        os: [windows-latest, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4

      # KiCad 10 bundles Python 3.11, so test against the interpreter plugins really run on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system libraries for VTK / Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Install exactly what KiCad will install into the plugin venv, plus test tools.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate plugin manifest
        run: python -m kipy.packaging validate .

      - name: Import GUI modules
        run: python -c "import kipi.gui.main_window, kipi.gui.viewer3d, kipi.gui.pi_panel, kipi_entry"

      - name: Run tests
        run: python -m pytest -v
